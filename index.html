<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mortgage Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <main>
    <h1>Mortgage Calculator</h1>

    <p id="file-warning" class="panel" style="color:#b42318" hidden>
      This page cannot run when opened as a file. Start the local server with
      <code>npm start</code> and open <a href="http://localhost:4173">http://localhost:4173</a>.
    </p>
    <script>
      if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
    </script>

    <section class="panel" aria-labelledby="h-inputs">
      <h2 id="h-inputs">Loan details</h2>
      <form id="form" novalidate autocomplete="off"></form>
    </section>

    <section class="panel" aria-labelledby="h-summary">
      <h2 id="h-summary">Summary</h2>
      <dl id="summary" class="summary"></dl>
    </section>

    <section class="panel" aria-labelledby="h-charts">
      <h2 id="h-charts">Charts</h2>
      <p id="chart-message" class="message" hidden></p>
      <div class="chart-box"><canvas id="balance-chart"></canvas></div>
      <div class="chart-box"><canvas id="flow-chart"></canvas></div>
    </section>

    <section class="panel" aria-labelledby="h-schedule">
      <h2 id="h-schedule">Amortization schedule</h2>
      <div id="schedule" class="schedule"></div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
